name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Opsional: Tag rilis (contoh: v1.0.0). Kosongkan untuk otomatis."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Antrian ULT FKIP APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Configure Supabase .env from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            cat <<EOF > .env
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          EOF
            echo "Configured .env from GitHub Repository Secrets."
          else
            cp .env.example .env
            echo "::warning::SUPABASE_URL atau SUPABASE_PUBLISHABLE_KEY belum diatur di GitHub Secrets. Menggunakan placeholder dari .env.example."
          fi

      - name: Ensure debug.keystore exists for debug builds
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=ID"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Release or Debug APK
        id: build_apk
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/Antrian-ULT-FKIP-release.apk
            echo "apk_path=release-artifacts/Antrian-ULT-FKIP-release.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=Release (Signed)" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RELEASE_KEYSTORE_BASE64 belum diatur — membangun APK installable (debug-signed)."
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/Antrian-ULT-FKIP-debug.apk
            echo "apk_path=release-artifacts/Antrian-ULT-FKIP-debug.apk" >> "$GITHUB_OUTPUT"
            echo "build_type=Debug (Installable)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antrian-ULT-FKIP-APK
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Antrian ULT FKIP Unila ${{ steps.tag_info.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## Antrian ULT FKIP Unila — Android APK
            - **Tipe Build**: ${{ steps.build_apk.outputs.build_type }}
            - **Commit**: `${{ github.sha }}`

            Unduh file `.apk` di bagian **Assets** di bawah untuk memasang aplikasi pada perangkat Android.
          files: |
            release-artifacts/*.apk
